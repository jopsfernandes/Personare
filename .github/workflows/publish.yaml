name: Publish Release

on:
  workflow_dispatch:

jobs:
  publish-release:
    runs-on: ${{ matrix.os }}
    strategy:
      # Both jobs attach to the same draft release; running them in parallel
      # could create two drafts for the same tag.
      max-parallel: 1
      matrix:
        os: [windows-2022, ubuntu-latest]
    permissions:
      contents: write
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Install Node and NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools rpm fakeroot dpkg

      - name: Install and build
        run: npm ci

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
